[project]
name = "weather-rnd"
version = "0.1.0"
description = "Weather notebooks: HRRR on H3 hexagons with marimo, xarray-sql and deck.gl"
requires-python = ">=3.13"
dependencies = [
    "anywidget>=0.9",
    "datafusion>=54.0.0",
    "duckdb>=1.5.5",
    "h3ronpy>=0.22.0",
    "icechunk",
    "marimo>=0.24.0",
    "numpy==2.5.1",
    "obstore>=0.9.2",
    "pyarrow>=25.0.0",
    "xarray",
    "xarray-sql[duckdb]==0.4.0rc1",
    "zarr>=3",
]

[dependency-groups]
dev = ["playwright"]
